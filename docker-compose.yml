version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scholly-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scholly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scholly-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholly-backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/scholly
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
    networks:
      - scholly-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholly-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - scholly-network

networks:
  scholly-network:
    driver: bridge

volumes:
  postgres_data: